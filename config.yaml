  max_tokens: 1024
  temperature: 0.15


evaluator:
  enable_artifacts: true
  cascade_evaluation: false
  use_llm_feedback: false

database:
  population_size: 80
  # num_islands: 3
  num_islands: 1
  migration_interval: 10
  feature_dimensions:
    - "combined_score"
    - "avg_retry_count"
