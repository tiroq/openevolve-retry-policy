# Minimal OpenEvolve configuration for local-model experimentation.
# Adjust model names and api_base to your local stack.

max_iterations: 50
checkpoint_interval: 5
random_seed: 42

# diff_based_evolution: true
diff_based_evolution: false
max_code_length: 12000

# Use custom prompt templates for mutation and evaluation feedback.
prompt:
  template_dir: "templates"

