# Minimal OpenEvolve configuration for local-model experimentation.
# Adjust model names and api_base to your local stack.

max_iterations: 50
checkpoint_interval: 5
random_seed: 42

diff_based_evolution: true
max_code_length: 12000

llm:
  models:
    # OpenRouter required OPENAI_API_KEY environment variable to be set.
    - name: "google/gemma-4-26b-a4b-it"
      weight: 1.0
  api_base: "https://openrouter.ai/api/v1"
  timeout: 1200
  temperature: 0.15

evaluator:
  enable_artifacts: true
  cascade_evaluation: false
  use_llm_feedback: false

database:
  population_size: 80
  # num_islands: 3
  num_islands: 1
  migration_interval: 10
  feature_dimensions:
    - "combined_score"
    - "avg_retry_count"
