version: "3"

vars:
  PYTHON: python3
  VENV: .venv
  PROGRAM: initial_program.py
  CANDIDATE: '{{.CANDIDATE | default .PROGRAM}}'
  EVALUATOR: evaluator.py
  CONFIG: config.yaml
  REPORT_DIR: reports

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  venv:
    desc: Create Python virtual environment
    status:
      - test -d {{.VENV}}
    cmds:
      - "{{.PYTHON}} -m venv {{.VENV}}"

  install:
    desc: Install dependencies
    deps: [venv]
    sources:
      - requirements.txt
    cmds:
      - "{{.VENV}}/bin/pip install -r requirements.txt"

  test:
    desc: Run pytest suite
    deps: [install]
    cmds:
      - "{{.VENV}}/bin/python -m pytest -q"

  test:verbose:
    desc: Run pytest with verbose output
    deps: [install]
    cmds:
      - "{{.VENV}}/bin/python -m pytest -v"

  lint:
    desc: Run syntax checks
    deps: [install]
    cmds:
      - "{{.VENV}}/bin/python -m py_compile {{.PROGRAM}}"
      - "{{.VENV}}/bin/python -m py_compile {{.EVALUATOR}}"
      - "{{.VENV}}/bin/python -m py_compile scenarios.py"

  eval:train:
    desc: Evaluate policy on training scenarios
    deps: [install]
    cmds:
      - "{{.VENV}}/bin/python {{.EVALUATOR}} --program {{.CANDIDATE}} --dataset train --json"

  eval:holdout:
    desc: Evaluate policy on holdout scenarios
    deps: [install]
    cmds:
      - "{{.VENV}}/bin/python {{.EVALUATOR}} --program {{.CANDIDATE}} --dataset holdout --json"

  eval:
    desc: Evaluate policy on both train and holdout
    cmds:
      - task: eval:train
      - task: eval:holdout

  smoke:
    desc: Run lint, tests, and both evals
    cmds:
      - task: lint
      - task: test
      - task: eval

  report:
    desc: Save train and holdout evaluation reports
    deps: [install]
    cmds:
      - mkdir -p {{.REPORT_DIR}}
      - "{{.VENV}}/bin/python {{.EVALUATOR}} --program {{.CANDIDATE}} --dataset train --json > {{.REPORT_DIR}}/train.json"
      - "{{.VENV}}/bin/python {{.EVALUATOR}} --program {{.CANDIDATE}} --dataset holdout --json > {{.REPORT_DIR}}/holdout.json"

  evolve:
    desc: Run full OpenEvolve mutation loop
    deps: [install]
    vars:
      ITERATIONS: '{{.ITERATIONS | default "50"}}'
    cmds:
      - "{{.VENV}}/bin/openevolve-run {{.PROGRAM}} {{.EVALUATOR}} --config {{.CONFIG}} --iterations {{.ITERATIONS}}"

  evolve:debug:
    desc: Run full OpenEvolve mutation loop in debug mode
    deps: [install]
    vars:
      ITERATIONS: '{{.ITERATIONS | default "50"}}'
    cmds:
      - "{{.VENV}}/bin/openevolve-run -l DEBUG {{.PROGRAM}} {{.EVALUATOR}} --config {{.CONFIG}} --iterations {{.ITERATIONS}}"

  clean:
    desc: Remove virtual environment and caches
    cmds:
      - rm -rf {{.VENV}}
      - rm -rf {{.REPORT_DIR}}
      - find . -type d -name __pycache__ -exec rm -rf {} +
      - find . -type d -name .pytest_cache -exec rm -rf {} +